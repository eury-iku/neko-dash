<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ねこダッシュ — Neko Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ===========================================================
       Neko Dash — visual refresh
       (ゲームのロジックは元のまま。CSS と DOM ラベルだけ調整)
       =========================================================== */

    :root {
      --bg:           oklch(0.975 0.012 82);   /* warm off-white */
      --bg-2:         oklch(0.955 0.015 82);
      --paper:        oklch(0.99  0.008 82);
      --ink:          oklch(0.22  0.02  255);  /* near-black, cool */
      --ink-2:        oklch(0.42  0.02  255);
      --ink-3:        oklch(0.62  0.015 255);
      --rule:         oklch(0.22  0.02  255 / 0.14);
      --rule-strong:  oklch(0.22  0.02  255 / 0.5);

      /* accents — same C & L, different H */
      --coral:        oklch(0.72 0.14 30);
      --sage:         oklch(0.72 0.08 160);
      --coral-deep:   oklch(0.52 0.14 30);
      --sage-deep:    oklch(0.50 0.08 160);

      --serif: "Instrument Serif", "Times New Roman", serif;
      --sans:  "Inter Tight", "Helvetica Neue", Helvetica, Arial, sans-serif;
      --mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      letter-spacing: 0.01em;
      background-color: var(--bg);
      background-image:
        radial-gradient(1200px 700px at 85% -10%, oklch(0.72 0.08 160 / 0.10), transparent 60%),
        radial-gradient(900px 600px at -10% 110%, oklch(0.72 0.14 30 / 0.08), transparent 60%),
        linear-gradient(var(--rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: auto, auto, 32px 32px, 32px 32px;
      background-position: 0 0, 0 0, -1px -1px, -1px -1px;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .game-shell {
      margin: auto;
    }

    /* ----- shell ----- */
    .game-shell {
      position: relative;
      width: min(96vw, 540px);
      display: grid;
      gap: 14px;
    }

    /* corner ticks (printer's marks vibe) */
    .game-shell::before,
    .game-shell::after {
      content: "";
      position: absolute;
      width: 14px; height: 14px;
      border: 1.5px solid var(--ink);
      pointer-events: none;
    }
    .game-shell::before { top: -10px;  left: -10px;  border-right: 0; border-bottom: 0; }
    .game-shell::after  { bottom: -10px; right: -10px; border-left: 0;  border-top: 0; }

    /* ----- masthead ----- */
    .masthead {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      padding: 0 2px 10px;
      border-bottom: 1.5px solid var(--ink);
      min-width: 0;
    }
    .mast-mark {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-2);
      padding: 3px 7px;
      border: 1px solid var(--rule-strong);
      border-radius: 999px;
      white-space: nowrap;
    }
    .mast-title {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(20px, 4.2vw, 28px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      text-align: center;
      color: var(--ink);
      min-width: 0;
      white-space: nowrap;
      overflow: visible;
      padding: 2px 0;
    }
    .mast-title em {
      font-style: italic;
      color: var(--coral-deep);
    }
    .mast-meta {
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-2);
      text-align: right;
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      .masthead { grid-template-columns: 1fr; gap: 6px; text-align: center; }
      .mast-mark, .mast-meta { font-size: 8.5px; letter-spacing: 0.14em; text-align: center; }
      .mast-mark { justify-self: center; padding: 3px 7px; }
      .mast-meta { justify-self: center; }
      .mast-title { font-size: clamp(24px, 7vw, 32px); padding: 4px 0; }
    }

    /* ----- HUD / top-bar ----- */
    .top-bar {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      align-items: stretch;
      padding: 0;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      font-family: var(--mono);
      overflow: hidden;
    }
    .top-bar > div {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-right: 1px solid var(--rule);
      white-space: nowrap;
    }
    .top-bar > div:last-child { border-right: 0; }
    .top-bar .label {
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-3);
      font-weight: 500;
    }
    .top-bar .value {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .top-bar > div:nth-child(2) { background: oklch(0.72 0.14 30 / 0.06); }
    .top-bar > div:nth-child(2) .value { color: var(--coral-deep); }
    .top-bar > div:nth-child(3) .value { color: var(--sage-deep); }

    /* ----- arena ----- */
    .game-area {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 5;
      min-height: 360px;
      max-height: 70vh;
      border: 1.5px solid var(--ink);
      background-color: var(--paper);
      background-image:
        linear-gradient(var(--rule) 1px, transparent 1px),
        linear-gradient(90deg, var(--rule) 1px, transparent 1px);
      background-size: 24px 24px, 24px 24px;
      box-shadow:
        0 1px 0 var(--ink),
        0 18px 40px -20px oklch(0.22 0.02 255 / 0.35);
      overflow: hidden;
      touch-action: none;
    }

    /* crosshair / framing in arena corners */
    .game-area::before,
    .game-area::after {
      content: "";
      position: absolute;
      width: 18px; height: 18px;
      border: 1.5px solid var(--ink);
      pointer-events: none;
      z-index: 2;
    }
    .game-area::before { top: 8px;    left: 8px;    border-right: 0; border-bottom: 0; }
    .game-area::after  { bottom: 8px; right: 8px;   border-left: 0;  border-top: 0; }

    .arena-label {
      position: absolute;
      top: 10px;
      right: 12px;
      z-index: 2;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-3);
      pointer-events: none;
    }
    .arena-label .dot {
      display: inline-block;
      width: 6px; height: 6px;
      border-radius: 999px;
      background: var(--coral);
      margin-right: 6px;
      vertical-align: 1px;
      box-shadow: 0 0 0 3px oklch(0.72 0.14 30 / 0.18);
    }
    .arena-foot {
      position: absolute;
      bottom: 10px;
      left: 12px;
      z-index: 2;
      font-family: var(--mono);
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-3);
      pointer-events: none;
    }

    /* ----- entities ----- */
    .player,
    .obstacle {
      position: absolute;
      display: grid;
      place-items: center;
      user-select: none;
      line-height: 1;
      will-change: transform;
      z-index: 3;
    }

    .player {
      width: 42px;
      height: 42px;
      font-size: 32px;
      filter: drop-shadow(0 6px 8px oklch(0.22 0.02 255 / 0.22));
    }
    /* subtle ring under the cat — reads as a "tracked target" */
    .player::after {
      content: "";
      position: absolute;
      inset: -6px;
      border: 1px dashed var(--rule-strong);
      border-radius: 999px;
      animation: spin 14s linear infinite;
      pointer-events: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .obstacle {
      width: 36px;
      height: 36px;
      font-size: 28px;
      filter: drop-shadow(0 4px 5px oklch(0.22 0.02 255 / 0.18));
    }

    /* ----- screens (start / game over) ----- */
    .screen {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 28px;
      background: oklch(0.99 0.008 82 / 0.92);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      text-align: left;
      z-index: 10;
    }
    .screen.active { display: flex; }

    .panel {
      width: min(100%, 420px);
      padding: 28px 28px 24px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      box-shadow: 8px 8px 0 var(--ink);
    }
    .panel .eyebrow {
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--ink-3);
      display: flex;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--rule);
    }

    h1, h2 {
      margin: 14px 0 10px;
      font-family: var(--serif);
      font-weight: 400;
      font-style: normal;
      line-height: 1;
      letter-spacing: -0.015em;
      color: var(--ink);
    }
    h1 { font-size: clamp(2.4rem, 9vw, 3.2rem); }
    h2 { font-size: clamp(2.4rem, 9vw, 3.2rem); }
    h1 em, h2 em { font-style: italic; color: var(--coral-deep); }

    .panel p {
      margin: 8px 0 18px;
      line-height: 1.55;
      font-size: 14px;
      font-weight: 400;
      color: var(--ink-2);
      max-width: 36ch;
    }

    /* score readout on game over */
    .readout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      margin: 14px 0 20px;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .readout > div {
      padding: 10px 0;
      font-family: var(--mono);
    }
    .readout > div + div {
      padding-left: 14px;
      border-left: 1px solid var(--rule);
    }
    .readout .k {
      display: block;
      font-size: 9.5px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 4px;
    }
    .readout .v {
      font-size: 26px;
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }
    .readout > div:nth-child(2) .v { color: var(--sage-deep); }

    /* ----- buttons ----- */
    button {
      width: 100%;
      min-height: 48px;
      padding: 0 18px;
      border: 1.5px solid var(--ink);
      border-radius: 0;
      color: var(--paper);
      background: var(--ink);
      font-family: var(--sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 4px 4px 0 var(--coral);
      transition: transform 80ms ease, box-shadow 80ms ease, background 80ms ease;
      display: inline-flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    button::after {
      content: "→";
      font-family: var(--mono);
      font-size: 16px;
      transform: translateX(0);
      transition: transform 120ms ease;
    }
    button:hover {
      background: var(--coral-deep);
      box-shadow: 6px 6px 0 var(--ink);
    }
    button:hover::after { transform: translateX(4px); }
    button:active {
      transform: translate(2px, 2px);
      box-shadow: 2px 2px 0 var(--coral);
    }

    .hint {
      display: block;
      margin-top: 14px;
      font-family: var(--mono);
      font-size: 10.5px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--ink-3);
    }
    .hint kbd {
      display: inline-block;
      padding: 2px 6px;
      border: 1px solid var(--rule-strong);
      border-bottom-width: 2px;
      border-radius: 3px;
      background: var(--bg-2);
      font-family: var(--mono);
      font-size: 10px;
      color: var(--ink);
      margin: 0 2px;
    }

    /* ----- legend (small key under arena) ----- */
    .legend {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0;
      border: 1px solid var(--rule-strong);
      background: var(--paper);
      font-family: var(--mono);
      font-size: 10px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--ink-2);
    }
    .legend > div {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-right: 1px solid var(--rule);
    }
    .legend > div:last-child { border-right: 0; }
    .legend .glyph {
      font-family: var(--sans);
      font-size: 16px;
      letter-spacing: 0;
    }

    /* ----- touch controls ----- */
    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(3, 54px);
      justify-content: center;
      gap: 8px;
      padding: 6px 0 2px;
      touch-action: none;
    }
    .touch-button {
      width: 64px;
      min-height: 54px;
      padding: 0;
      border: 1.5px solid var(--ink);
      border-radius: 0;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 3px 3px 0 var(--ink);
      font-family: var(--mono);
      font-size: 1.2rem;
      letter-spacing: 0;
      text-transform: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }
    .touch-button::after { content: none; }
    .touch-button:active,
    .touch-button.is-pressed {
      color: var(--paper);
      background: var(--ink);
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 var(--ink);
    }
    .touch-up    { grid-column: 2; grid-row: 1; }
    .touch-left  { grid-column: 1; grid-row: 2; }
    .touch-right { grid-column: 3; grid-row: 2; }
    .touch-down  { grid-column: 2; grid-row: 3; }

    @media (max-width: 420px) {
      body { padding: 12px; }
      .game-shell { width: 96vw; }
      .top-bar .value { font-size: 18px; }
      .top-bar > div { padding: 8px 10px; }
      .game-area { min-height: 360px; max-height: 60vh; }
      .screen { padding: 18px; }
      .panel { padding: 22px 20px 20px; box-shadow: 5px 5px 0 var(--ink); }
      h1, h2 { font-size: clamp(2rem, 11vw, 2.6rem); }
      .legend { font-size: 9px; }
      .legend > div { padding: 6px 8px; gap: 6px; }
      .touch-controls { display: grid; }
    }
    @media (hover: none) and (pointer: coarse) {
      body { align-items: start; padding-top: 12px; }
      .touch-controls { display: grid; }
    }
  </style>
</head>
<body>
  <main class="game-shell" aria-label="ねこダッシュ">

    <header class="masthead">
      <span class="mast-mark">No. 01</span>
      <h3 class="mast-title" style="margin:0;">ねこ<em>ダッシュ</em></h3>
      <span class="mast-meta">Edition · 2026</span>
    </header>

    <section class="top-bar" aria-live="polite">
      <div>
        <span class="label">Score</span>
        <span class="value" id="scoreText">0</span>
      </div>
      <div>
        <span class="label">High</span>
        <span class="value" id="highScoreText">0</span>
      </div>
      <div>
        <span class="label">Level</span>
        <span class="value" id="levelText">1</span>
      </div>
    </section>

    <section class="game-area" id="gameArea">
      <span class="arena-label"><span class="dot"></span>Field · 4×5</span>
      <span class="arena-foot">Avoid · 回避せよ</span>

      <div class="player" id="player" aria-label="プレイヤー">🐈</div>

      <div class="screen active" id="startScreen">
        <div class="panel">
          <div class="eyebrow">
            <span>Vol. 01 — Dash</span>
            <span>Ready ●</span>
          </div>
          <h1>ねこ<em>ダッシュ</em></h1>
          <p>四方から飛んでくる障害物を避けて、できるだけ長く生き残ろう。猫は素早く、世界は狭い。</p>
          <button id="startButton" type="button">スタート</button>
          <span class="hint">
            <kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> or <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>
          </span>
        </div>
      </div>

      <div class="screen" id="gameOverScreen">
        <div class="panel">
          <div class="eyebrow">
            <span>Run terminated</span>
            <span>End ●</span>
          </div>
          <h2>Game <em>Over</em></h2>
          <div class="readout">
            <div>
              <span class="k">This run</span>
              <span class="v" id="finalScoreText">0</span>
            </div>
            <div>
              <span class="k">High score</span>
              <span class="v" id="finalHighScoreText">0</span>
            </div>
          </div>
          <button id="restartButton" type="button">もう一度遊ぶ</button>
          <span class="hint"><kbd>Enter</kbd> to restart</span>
        </div>
      </div>
    </section>

    <section class="legend" aria-hidden="true">
      <div><span class="glyph">🍎</span><span>Normal</span></div>
      <div><span class="glyph">🧶</span><span>Sway</span></div>
      <div><span class="glyph">💧</span><span>Fast</span></div>
    </section>

    <section class="touch-controls" aria-label="スマホ用移動ボタン">
      <button class="touch-button touch-up"    type="button" data-key="ArrowUp"    aria-label="上へ移動">↑</button>
      <button class="touch-button touch-left"  type="button" data-key="ArrowLeft"  aria-label="左へ移動">←</button>
      <button class="touch-button touch-right" type="button" data-key="ArrowRight" aria-label="右へ移動">→</button>
      <button class="touch-button touch-down"  type="button" data-key="ArrowDown"  aria-label="下へ移動">↓</button>
    </section>
  </main>

  <script>
    // ===== ロジックは元のコードのまま (一切変更していません) =====

    const gameArea = document.getElementById("gameArea");
    const player = document.getElementById("player");
    const startScreen = document.getElementById("startScreen");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const startButton = document.getElementById("startButton");
    const restartButton = document.getElementById("restartButton");
    const scoreText = document.getElementById("scoreText");
    const highScoreText = document.getElementById("highScoreText");
    const levelText = document.getElementById("levelText");
    const finalScoreText = document.getElementById("finalScoreText");
    const finalHighScoreText = document.getElementById("finalHighScoreText");
    const touchButtons = document.querySelectorAll(".touch-button");

    let highScore = Number(localStorage.getItem("nekoDashHighScore")) || 0;

    let gameState = "start";
    let score = 0;
    let level = 1;
    let playerX = 0;
    let playerY = 0;
    let obstacles = [];
    let pressedKeys = {};
    let lastTime = 0;
    let obstacleTimer = 0;
    let animationId = null;

    const playerSize = 42;
    const obstacleTypes = [
      { type: "normal", emoji: "🍎", size: 36, speedBonus: 0, swayRange: 0 },
      { type: "sway", emoji: "🧶", size: 36, speedBonus: 18, swayRange: 34 },
      { type: "fast", emoji: "💧", size: 26, speedBonus: 120, swayRange: 0 }
    ];

    highScoreText.textContent = highScore;

    function drawPlayer() {
      player.style.transform = `translate(${playerX}px, ${playerY}px)`;
    }

    function getAreaSize() {
      return {
        width: gameArea.clientWidth,
        height: gameArea.clientHeight
      };
    }

    function resetGame() {
      const area = getAreaSize();
      score = 0;
      level = 1;
      obstacles.forEach((item) => item.element.remove());
      obstacles = [];
      pressedKeys = {};
      obstacleTimer = 0;
      lastTime = performance.now();

      playerX = area.width / 2 - playerSize / 2;
      playerY = area.height - playerSize - 18;
      drawPlayer();
      updateScoreDisplay();
    }

    function startGame() {
      resetGame();
      gameState = "playing";
      startScreen.classList.remove("active");
      gameOverScreen.classList.remove("active");
      animationId = requestAnimationFrame(gameLoop);
    }

    function updateScoreDisplay() {
      scoreText.textContent = Math.floor(score);
      highScoreText.textContent = highScore;
      levelText.textContent = level;
    }

    function pickObstacleType() {
      const fastChance = Math.min(0.32, 0.08 + score / 1200);
      const swayChance = Math.min(0.38, 0.16 + score / 1000);
      const randomValue = Math.random();

      if (randomValue < fastChance) {
        return obstacleTypes[2];
      }
      if (randomValue < fastChance + swayChance) {
        return obstacleTypes[1];
      }
      return obstacleTypes[0];
    }

    function getSpawnData(area, size) {
      const side = Math.floor(Math.random() * 4);
      let x = 0;
      let y = 0;
      let directionX = 0;
      let directionY = 0;

      if (side === 0) {
        x = Math.random() * (area.width - size);
        y = -size;
        directionX = Math.random() * 0.5 - 0.25;
        directionY = 1;
      } else if (side === 1) {
        x = Math.random() * (area.width - size);
        y = area.height;
        directionX = Math.random() * 0.5 - 0.25;
        directionY = -1;
      } else if (side === 2) {
        x = -size;
        y = Math.random() * (area.height - size);
        directionX = 1;
        directionY = Math.random() * 0.5 - 0.25;
      } else {
        x = area.width;
        y = Math.random() * (area.height - size);
        directionX = -1;
        directionY = Math.random() * 0.5 - 0.25;
      }

      const length = Math.hypot(directionX, directionY);
      return {
        x,
        y,
        directionX: directionX / length,
        directionY: directionY / length
      };
    }

    function createObstacle() {
      const area = getAreaSize();
      const element = document.createElement("div");
      const obstacleType = pickObstacleType();
      const spawnData = getSpawnData(area, obstacleType.size);

      element.className = "obstacle";
      element.textContent = obstacleType.emoji;
      element.style.width = `${obstacleType.size}px`;
      element.style.height = `${obstacleType.size}px`;
      element.style.fontSize = `${Math.max(22, obstacleType.size - 6)}px`;
      gameArea.appendChild(element);

      obstacles.push({
        element,
        type: obstacleType.type,
        x: spawnData.x,
        y: spawnData.y,
        mainX: spawnData.x,
        mainY: spawnData.y,
        directionX: spawnData.directionX,
        directionY: spawnData.directionY,
        size: obstacleType.size,
        swayRange: obstacleType.swayRange,
        swaySpeed: 2.4 + Math.random() * 1.4,
        swayOffset: Math.random() * Math.PI * 2,
        speed: 150 + level * 16 + obstacleType.speedBonus + Math.random() * 60
      });
    }

    function movePlayer(deltaTime) {
      const area = getAreaSize();
      const moveDistance = 260 * deltaTime;

      if (pressedKeys.ArrowLeft || pressedKeys.KeyA) {
        playerX -= moveDistance;
      }
      if (pressedKeys.ArrowRight || pressedKeys.KeyD) {
        playerX += moveDistance;
      }
      if (pressedKeys.ArrowUp || pressedKeys.KeyW) {
        playerY -= moveDistance;
      }
      if (pressedKeys.ArrowDown || pressedKeys.KeyS) {
        playerY += moveDistance;
      }

      playerX = Math.max(0, Math.min(area.width - playerSize, playerX));
      playerY = Math.max(0, Math.min(area.height - playerSize, playerY));
      drawPlayer();
    }

    function isHit(a, b) {
      return (
        a.x < b.x + b.size &&
        a.x + a.size > b.x &&
        a.y < b.y + b.size &&
        a.y + a.size > b.y
      );
    }

    function updateObstacles(deltaTime) {
      const area = getAreaSize();
      const playerBox = {
        x: playerX + 6,
        y: playerY + 6,
        size: playerSize - 12
      };

      obstacles.forEach((item) => {
        item.mainX += item.directionX * item.speed * deltaTime;
        item.mainY += item.directionY * item.speed * deltaTime;
        item.x = item.mainX;
        item.y = item.mainY;

        if (item.type === "sway") {
          const distance = Math.hypot(item.mainX, item.mainY);
          const wave = Math.sin(distance / 55 * item.swaySpeed + item.swayOffset);
          const sway = wave * item.swayRange;
          item.x = item.mainX + -item.directionY * sway;
          item.y = item.mainY + item.directionX * sway;
        }

        item.element.style.transform = `translate(${item.x}px, ${item.y}px)`;

        const hitMargin = item.type === "fast" ? 3 : 4;
        const obstacleBox = {
          x: item.x + hitMargin,
          y: item.y + hitMargin,
          size: item.size - hitMargin * 2
        };

        if (isHit(playerBox, obstacleBox)) {
          endGame();
        }
      });

      obstacles = obstacles.filter((item) => {
        const margin = item.size + item.swayRange + 20;
        const isOutside =
          item.x < -margin ||
          item.x > area.width + margin ||
          item.y < -margin ||
          item.y > area.height + margin;

        if (isOutside) {
          item.element.remove();
          return false;
        }
        return true;
      });
    }

    function endGame() {
      if (gameState !== "playing") {
        return;
      }

      gameState = "gameover";
      cancelAnimationFrame(animationId);
      highScore = Math.max(highScore, Math.floor(score));
      localStorage.setItem("nekoDashHighScore", highScore);

      finalScoreText.textContent = Math.floor(score);
      finalHighScoreText.textContent = highScore;
      updateScoreDisplay();
      gameOverScreen.classList.add("active");
    }

    function gameLoop(currentTime) {
      if (gameState !== "playing") {
        return;
      }

      const deltaTime = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      score += deltaTime * 10;
      level = 1 + Math.floor(score / 100);

      obstacleTimer += deltaTime;
      const spawnInterval = Math.max(0.18, 0.9 - level * 0.055 - score / 2500);
      if (obstacleTimer >= spawnInterval) {
        createObstacle();
        obstacleTimer = 0;
      }

      movePlayer(deltaTime);
      updateObstacles(deltaTime);
      updateScoreDisplay();

      animationId = requestAnimationFrame(gameLoop);
    }

    function pressMoveKey(keyCode) {
      pressedKeys[keyCode] = true;
    }

    function releaseMoveKey(keyCode) {
      pressedKeys[keyCode] = false;
    }

    window.addEventListener("keydown", (event) => {
      if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
        event.preventDefault();
      }

      pressMoveKey(event.code);

      if ((event.code === "Enter" || event.code === "Space") && gameState !== "playing") {
        startGame();
      }
    });

    window.addEventListener("keyup", (event) => {
      releaseMoveKey(event.code);
    });

    touchButtons.forEach((button) => {
      const keyCode = button.dataset.key;

      button.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        button.setPointerCapture(event.pointerId);
        button.classList.add("is-pressed");
        pressMoveKey(keyCode);
      });

      button.addEventListener("pointerup", () => {
        button.classList.remove("is-pressed");
        releaseMoveKey(keyCode);
      });

      button.addEventListener("pointercancel", () => {
        button.classList.remove("is-pressed");
        releaseMoveKey(keyCode);
      });

      button.addEventListener("pointerleave", () => {
        button.classList.remove("is-pressed");
        releaseMoveKey(keyCode);
      });
    });

    window.addEventListener("resize", () => {
      const area = getAreaSize();
      playerX = Math.max(0, Math.min(area.width - playerSize, playerX));
      playerY = Math.max(0, Math.min(area.height - playerSize, playerY));
      drawPlayer();
    });

    startButton.addEventListener("click", startGame);
    restartButton.addEventListener("click", startGame);

    resetGame();
  </script>
</body>
</html>
